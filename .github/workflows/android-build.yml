name: Android APK
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Restore testing signing identity
        uses: actions/cache@v4
        with:
          path: .signing/pulse-test.jks
          key: pulse-explicit-testing-signing-v1
          fail-on-cache-miss: true
      - name: Require existing update identity
        run: test -s .signing/pulse-test.jks
      - name: Install SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Build, test and lint
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug testDebugUnitTest lintDebug --no-daemon
      - name: Verify APK signature
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/debug/app-debug.apk | tee signing-verification.txt
          grep -F "Signer #1 certificate SHA-256 digest: 4db58908d9a1bc9ec251ccd7f0ca3d9182b1371c0c79a3f1ce8413e1a5e48a63" signing-verification.txt
      - name: Upload installable debug-signed APK
        uses: actions/upload-artifact@v4
        with:
          name: Pulse165-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
            app/build/screenshots/
            app/schemas/
